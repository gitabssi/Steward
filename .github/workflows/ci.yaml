# Credential-free CI: what any clone can verify without a cloud project.
# The WIF-authenticated pipelines (pr_checks, staging, deploy-to-prod) are
# provisioned by deployment/terraform/cicd and run on manual dispatch
# until that infrastructure is applied.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check app fixtures data edge primacy
      - name: Policy tests (authority, scope, supervisor, guards, arbiter)
        run: uv run pytest tests/unit -q

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the console
        working-directory: console
        run: npm install --no-fund --no-audit && npm run build
